<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About Me ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffe1ee;--dot:#ffc9de;--surface:#fff8fb;--ink:#7a2650;--muted:#a8658a;--line:#ffb8d3;--accent:#ff6fa8;--accent-ink:#fff;--soft:#ffd0e3;--like:#e0508d;--dis:#8a6fb5;--star:#ffb020;--c0:#ffd9ec;--c1:#ffe9a8;--c2:#cfeedd;--c3:#dccff7;--c4:#cfe6ff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#3a1830;--dot:#4a2040;--surface:#4a2040;--ink:#ffe3f0;--muted:#e0a3c4;--line:#7d3a66;--accent:#ff79b0;--accent-ink:#4a1233;--soft:#5e2a4e;--like:#ff9cc6;--dis:#c8b0f0;--c0:#6b2f58;--c1:#6b5a2a;--c2:#2f5a48;--c3:#4a3a78;--c4:#2f4a6b}}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif;background-color:var(--bg);background-image:radial-gradient(var(--dot) 3px,transparent 3.5px);background-size:30px 30px}
h1,h2,h3,button,.tab,label,.chip{font-family:Fredoka,Nunito,system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:36px 20px 80px;display:grid;grid-template-columns:320px 1fr;gap:40px;align-items:start}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
aside{position:sticky;top:24px}
@media(max-width:800px){aside{position:static}}
.photo{position:relative;background:#fff;padding:12px 12px 46px;border-radius:22px;border:4px solid var(--accent);box-shadow:0 8px 0 var(--line);transform:rotate(-2deg);margin:18px 8px 30px}
.photo img,.photo .ph{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--soft)}
.photo .bow{position:absolute;top:-34px;left:-26px;width:96px;transform:rotate(-16deg);filter:drop-shadow(0 3px 0 rgba(176,36,90,.25))}
.photo::after{content:"♡ ♡ ♡";position:absolute;bottom:10px;left:0;right:0;text-align:center;color:var(--accent);letter-spacing:6px;font-size:16px}
.ph{display:grid;place-items:center;color:var(--muted);font:600 16px Fredoka,sans-serif}
h1{font-size:44px;line-height:1.05;margin:0 0 6px;font-weight:700;color:var(--ink)}
.tag{margin:0 0 22px;color:var(--muted)}
.lk h3{margin:0 0 6px;font-size:19px}
.lk ul{margin:0 0 16px;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:7px}
.lk li{padding:2px 14px;border-radius:99px;font-size:15px;font-weight:600;background:var(--surface);border:2.5px solid var(--like);color:var(--like)}
.lk .dis li{border-color:var(--dis);color:var(--dis);border-style:dashed}
button{cursor:pointer;border:0;border-radius:99px;padding:8px 18px;font-weight:600;font-size:16px;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 rgba(122,38,80,.25)}
button:active{transform:translateY(2px);box-shadow:none}
button.ghost{background:var(--surface);border:2.5px solid var(--line);color:var(--ink);box-shadow:none}
button.danger{background:var(--surface);color:#d03a62;border:2.5px solid #f2a0b8;box-shadow:none}
button:focus-visible,.tab:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.tabs{display:flex;gap:8px;margin-bottom:26px;overflow-x:auto;padding:4px 2px 10px}
.tab{background:var(--surface);border:2.5px solid var(--line);color:var(--muted);font-size:18px;padding:8px 20px;white-space:nowrap;box-shadow:none}
.tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 rgba(122,38,80,.25)}
.now{background:var(--surface);border:3px dashed var(--accent);border-radius:22px;padding:18px 24px;margin-bottom:26px;display:flex;justify-content:space-between;gap:16px;align-items:center}
.now small{font:600 15px Fredoka,sans-serif;color:var(--accent)}
.now h2{margin:2px 0 0;font-size:28px;line-height:1.15}
.now p{margin:0;color:var(--muted)}
.list{background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:6px 22px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:14px 0;border-bottom:2px dotted var(--line);align-items:center}
.row:last-child{border-bottom:0}
.row b{font:600 20px Fredoka,sans-serif}
.row .sub{color:var(--muted);font-size:15px}
.stars{color:var(--star);letter-spacing:2px;font-size:19px;white-space:nowrap}
.stars i{color:var(--line);font-style:normal}
.chip{padding:3px 14px;border-radius:99px;font-weight:600;font-size:15px;white-space:nowrap;border:2px solid var(--line);color:var(--ink)}
.s0{background:var(--c0)}.s1{background:var(--c1)}.s2{background:var(--c2)}.s3{background:var(--c3)}.s4{background:var(--c4)}
.ctl{display:none;grid-column:1/-1;gap:8px}
body.editing .ctl{display:flex}
.ctl button{padding:3px 14px;font-size:14px} 
  button:disabled{opacity:.4;cursor:default} .subs{margin:8px 0 2px;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px} .subs li{padding:1px 14px;border-radius:99px;background:var(--soft);font-weight:600;font-size:15px} .chip.note{margin-left:10px;font-size:13px;padding:1px 10px}
.empty{color:var(--muted);padding:18px 0} 
  .cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px} 
  .cat{background:var(--surface);border:2.5px solid var(--line);color:var(--muted);padding:4px 16px;font-size:15px;box-shadow:none} 
  .cat[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} 
  .pager{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:18px} 
  .pager button{padding:4px 14px;font-size:15px} 
  .pg{min-width:40px;background:var(--surface);border:2.5px solid var(--line);color:var(--muted);box-shadow:none} 
  .pg[aria-current=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} 
  .links{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px} 
  .links a{padding:3px 16px;border-radius:99px;border:2.5px solid var(--accent);color:var(--accent);background:var(--surface);font:600 15px Fredoka,sans-serif;text-decoration:none} 
  .links a:hover{background:var(--accent);color:var(--accent-ink)} 
  .card{background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:22px 26px;min-height:240px} 
  .card h2{margin:0 0 14px;font-size:26px} 
  .card .bio{white-space:pre-line;margin:0} 
  .kvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px} 
  .kv{background:var(--bg);border-radius:16px;padding:8px 14px} 
  .kv small{display:block;font:600 13px Fredoka,sans-serif;color:var(--accent)} 
  .kv span{font-weight:700} 
  .funs{margin:0;padding:0;list-style:none} 
  .funs li{padding:6px 0 6px 28px;position:relative;border-bottom:2px dotted var(--line)} 
  .funs li::before{content:"✿";position:absolute;left:0;color:var(--accent)} 
#search{width:100%;font:inherit;padding:10px 18px;border-radius:99px;border:2.5px solid 
var(--line);background:var(--surface);color:var(--ink);margin-bottom:18px} 
#search:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#editToggle{display:none}
body.can-edit #editToggle{display:inline-block}
.only-edit{display:none}
body.editing .only-edit{display:inline-block}
.add{margin-bottom:14px}
dialog{border:3px solid var(--accent);border-radius:22px;padding:24px;width:min(440px,92vw);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(122,38,80,.4)}
dialog::backdrop{background:rgba(122,38,80,.45)}
dialog h2{margin:0 0 14px}
dialog label{display:block;font-weight:600;font-size:16px;margin:12px 0 4px}
dialog input,dialog textarea,dialog select{width:100%;font:inherit;padding:8px 12px;border-radius:14px;border:2.5px solid var(--line);background:var(--bg);color:var(--ink)}
dialog .hint{font-size:13px;color:var(--muted);margin:2px 0 0}
dialog .bar{justify-content:flex-end;margin-top:20px}
@media(prefers-reduced-motion:no-preference){.tab,button{transition:background .15s,transform .1s}}
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <div class="photo" id="photo"></div>
    <h1 id="name"></h1>
    <p class="tag" id="tagline"></p>
    <div class="links" id="links"></div>
    <div class="bar">
      <button id="editToggle" class="ghost">Edit page</button>
      <button id="editProfile" class="only-edit">Edit profile</button>
    </div>
    <div class="bar only-edit" id="dataBar">
      <button class="ghost" id="exp">Export backup</button>
      <button class="ghost" id="imp">Import backup</button>
      <input type="file" id="impFile" accept="application/json" hidden>
    </div>
  </aside>
  <main>
    <div class="tabs" role="tablist" id="tabs"></div>     
    <input id="search" type="search" placeholder="Search this tab ♡" aria-label="Search this tab">
    <div id="panel" role="tabpanel"></div>
  </main>
</div>
<dialog id="dlg"><form method="dialog" id="form"></form></dialog>

<script>
const KEY = "aboutme.v2";
const BOW = `<svg class="bow" viewBox="0 0 80 50" aria-hidden="true"><g stroke="#b0245a" stroke-width="2.5" stroke-linejoin="round"><path d="M40 25C28 3 3 4 6 23c3 20 23 18 34 2Z" fill="#ff6fa8"/><path d="M40 25C52 3 77 4 74 23c-3 20-23 18-34 2Z" fill="#ff6fa8"/><circle cx="40" cy="25" r="8" fill="#ff3d81"/></g></svg>`;
const CARDS = [   {k:"bio", title:"💗 About me", type:"text"},   
               {k:"facts", title:"✨ Quick facts", type:"pairs"},   
               {k:"favs", title:"🍰 Favorites", type:"pairs"},   
               {k:"now", title:"🌸 Currently into", type:"pairs"},   
               {k:"fun", title:"🎀 Fun facts", type:"lines"},   
               {k:"likes", title:"♡ Likes & dislikes", type:"likes"} ]; 
  const T = {   about:{label:"💗 About", kind:"about"},
  reading:{label:"📚 Reading", title:"Book", sub:"Author", kind:"rating", now:"Currently reading"},
  games:{label:"🎮 Games", title:"Game", sub:"Platform", subOptions:["PC","Mobile"], kind:"status", statuses:["Playing","Only When Invited","Rarely","Completed","Wishlist"]},  
  movies:{label:"🎬 Movies", title:"Title", sub:"Year or notes", categories:["Anime","K-Drama","Others"], kind:"rating", now:"Currently watching"},
  others:{label:"✨ Others", title:"Hobby", sub:"", kind:"groups"}
};
const defaults = {
  profile:{name:"Loren/Jang", tagline:"lagi't lagi, para sa bayan. padayon.", photo:"photo.jpg", socials:[{l:"Instagram", u:"https://instagram.com/"}, {l:"Discord", u:"https://discord.com/"}],
    likes:["color red","Feminism","CAKE","AoT Hange","VALORANT Viper","Ampalaya"], dislikes:["confusion","rain","insensitive people"]},
  current:{reading:{title:"The Hobbit", sub:"J.R.R. Tolkien"}, movies:{title:"", sub:""}},
  about:{     bio:"Lagi't lagi, para sa bayan. Padayon.",     facts:[{l:"Nickname", v:"Laura/Lauravel"},{l:"Birthday", v:"2004 May 07"},{l:"Height", v:"141cm"},{l:"College course", v:"4th year/Bachelor of Science in Computer Science"},{l:"From", v:"University of Mindanao"}],     favs:[{l:"Color", v:"Red"},{l:"Food", v:"Cake"},{l:"Anime character", v:"Hange"},{l:"Game character", v:"Viper"}],     now:[{l:"Reading", v:"The Hobbit"},{l:"Watching", v:"Add yours"},{l:"Listening to", v:"Add yours"}],     fun:["Add a fun fact about yourself here."]   },   items:{
    reading:[{title:"Sample Book", sub:"Sample Author", rating:4}],
    games:[{title:"Sample Game", sub:"PC", status:"Playing"}],
    movies:[       {title:"Sample Anime", sub:"2013", rating:5, cat:"Anime"},       {title:"Sample K-Drama", sub:"2020", rating:4, cat:"K-Drama"},       {title:"Sample Movie", sub:"2019", rating:4, cat:"Others"}     ],
    others:[       
      {title:"Dancing", note:"", sub:["Folk Dance","Cheer Dance"]},       
      {title:"Crochet", note:"", sub:[]},       
      {title:"Writing", note:"", sub:["Copy Reader and Headline Writer","Journaling"]},       
      {title:"Coffee hopping", note:"soon to be updated", sub:[]}     
    ],
  }
};
const PAGE_SIZE = 5; 
  let S, tab = "about", query = "", cat = "", page = 0;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!S || !S.items || !S.current) S = structuredClone(defaults); if (!S.items.others) S.items.others = structuredClone(defaults.items.others);
function ensure(){   
  if (!S.items.others) S.items.others = structuredClone(defaults.items.others);   
  if (!S.about) S.about = structuredClone(defaults.about);   
  if (!S.profile.socials) S.profile.socials = structuredClone(defaults.profile.socials); 
} 
  ensure(); 
  const save = () => 
    { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { alert("Couldn’t save. The photo may be too large."); } };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stars = n => `<span class="stars" aria-label="${n} out of 5">${"★".repeat(n)}<i>${"★".repeat(5-n)}</i></span>`;

function renderProfile(){
  const p = S.profile;
  $("#photo").innerHTML = BOW + (p.photo ? `<img src="${p.photo}" alt="Photo of ${esc(p.name)}">` : `<div class="ph">Add your photo ♡</div>`);
  $("#name").textContent = p.name;
  $("#tagline").textContent = p.tagline;
  const safe = u => /^(https?:\/\/|mailto:)/i.test(u) ? u : "https://" + u;
  $("#links").innerHTML = (p.socials || []).map(x => `<a href="${esc(safe(x.u))}" target="_blank" rel="noopener">${esc(x.l)}</a>`).join("");}
function renderTabs(){
  $("#tabs").innerHTML = Object.entries(T).map(([k,v]) => `<button class="tab" role="tab" aria-selected="${k===tab}" data-tab="${k}">${v.label}</button>`).join("");
}
function renderAbout(){
  const pages = CARDS.length;
  if (page >= pages) page = pages - 1;
  const c = CARDS[page], A = S.about, p = S.profile;
  const chips = a => (a || []).map(x => `<li>${esc(x)}</li>`).join("");
  let body;
  if (c.type === "text") body = `<p class="bio">${esc(A.bio)}</p>`;
  else if (c.type === "pairs") body = `<div class="kvs">${(A[c.k] || []).map(x => `<div class="kv"><small>${esc(x.l)}</small><span>${esc(x.v)}</span></div>`).join("")}</div>`;
  else if (c.type === "lines") body = `<ul class="funs">${(A[c.k] || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  else body = `<div class="lk"><h3>♡ Likes</h3><ul>${chips(p.likes)}</ul><h3>✿ Dislikes</h3><ul class="dis">${chips(p.dislikes)}</ul></div>`;
  const pager = `<div class="pager"><button class="ghost" data-page="${page-1}" ${page===0?"disabled":""}>‹ Prev</button>${CARDS.map((x, n) => `<button class="pg" data-page="${n}" aria-current="${n===page}" aria-label="${esc(x.title)}">${n+1}</button>`).join("")}<button class="ghost" data-page="${page+1}" ${page===pages-1?"disabled":""}>Next ›</button></div>`;
  $("#panel").innerHTML = `<div class="card"><h2>${c.title}</h2>${body}<button class="only-edit ghost" data-act="aedit" style="margin-top:16px">Edit this card</button></div>` + pager;
}
function renderPanel(){
  const t = T[tab], list = S.items[tab];
  $("#search").hidden = t.kind === "about";
  if (t.kind === "about") return renderAbout();
  let h = "";
  if (t.now) {
    const c = S.current[tab] || {};
    h += `<div class="now"><div><small>♡ ${t.now}</small>${c.title ? `<h2>${esc(c.title)}</h2><p>${esc(c.sub)}</p>` : `<h2>Nothing right now</h2>`}</div><button class="only-edit ghost" data-act="current">Edit</button></div>`;
  }
  h += `<button class="only-edit add" data-act="add">Add ${t.title.toLowerCase()}</button>`;
  const q = query.trim().toLowerCase();
  if (t.categories) h += `<div class="cats">${["All", ...t.categories].map(c => { const v = c === "All" ? "" : c; return `<button class="cat" data-cat="${v}" aria-pressed="${v === cat}">${c}</button>`; }).join("")}</div>`;
  const shown = list.map((it,i) => ({it,i})).filter(({it}) => (!cat || !t.categories || (it.cat || "Others") === cat) && (!q || [it.title, it.note, it.status, it.cat].concat(it.sub || []).join(" ").toLowerCase().includes(q)));
  const pages = Math.max(1, Math.ceil(shown.length / PAGE_SIZE));
  if (page >= pages) page = pages - 1;
  const view = shown.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);
  const pager = pages > 1 ? `<div class="pager"><button class="ghost" data-page="${page-1}" ${page===0?"disabled":""}>‹ Prev</button>${Array.from({length:pages}, (_, n) => `<button class="pg" data-page="${n}" aria-current="${n===page}" aria-label="Page ${n+1}">${n+1}</button>`).join("")}<button class="ghost" data-page="${page+1}" ${page===pages-1?"disabled":""}>Next ›</button></div>` : "";
  h += shown.length ? `<div class="list">` + view.map(({it,i}) => {
    let main, side = "";
    if (t.kind === "groups") {
      main = `<b>${esc(it.title)}</b>${it.note ? `<span class="chip note s1">${esc(it.note)}</span>` : ""}${(it.sub||[]).length ? `<ul class="subs">${it.sub.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}`;
    } else {
      main = `<b>${esc(it.title)}</b><br><span class="sub">${[t.categories ? (it.cat || "Others") : "", it.sub].filter(Boolean).map(esc).join(" · ")}</span>`;
      side = t.kind === "rating" ? stars(it.rating || 0)
        : `<span class="chip s${Math.max(0, t.statuses.indexOf(it.status))}">${esc(it.status || t.statuses[0])}</span>`;
    }
    return `<div class="row"><div>${main}</div>${side}<div class="ctl"><button class="ghost" data-act="up" data-i="${i}" aria-label="Move up" ${i===0||q||cat?"disabled":""}>↑</button><button class="ghost" data-act="down" data-i="${i}" aria-label="Move down" ${i===list.length-1||q||cat?"disabled":""}>↓</button><button class="ghost" data-act="edit" data-i="${i}">Edit</button><button class="danger" data-act="del" data-i="${i}">Remove</button></div></div>`;
  }).join("") + `</div>` + pager : `<p class="empty">${q ? "No matches found ♡" : `Nothing here yet. Turn on Edit page to add your first ${t.title.toLowerCase()} ♡`}</p>`;
  $("#panel").innerHTML = h;
}
const renderAll = () => { renderProfile(); renderTabs(); renderPanel(); };

/* Generic form dialog */
function openForm(title, fields, onSave, onDelete){
  const f = $("#form");
  f.innerHTML = `<h2>${esc(title)}</h2>` + fields.map(x => `<label for="f_${x.k}">${esc(x.label)}</label>` +
    (x.type === "textarea" ? `<textarea id="f_${x.k}" rows="6">${esc(x.v)}</textarea>`
     : x.type === "select" ? `<select id="f_${x.k}">${x.options.map(o => `<option ${o===x.v?"selected":""}>${esc(o)}</option>`).join("")}</select>`
     : x.type === "file" ? `<input id="f_${x.k}" type="file" accept="image/*">`
     : `<input id="f_${x.k}" type="${x.type||"text"}" value="${esc(x.v)}" ${x.attrs||""}>`) + (x.hint ? `<p class="hint">${esc(x.hint)}</p>` : "")).join("") +
    `<div class="bar">${onDelete ? `<button type="button" class="danger" id="fDel">Remove</button>` : ""}<button type="button" class="ghost" id="fCancel">Cancel</button><button type="submit">Save changes</button></div>`;
  $("#fCancel").onclick = () => $("#dlg").close();
  if (onDelete) $("#fDel").onclick = () => { onDelete(); $("#dlg").close(); };
  f.onsubmit = async e => {
    e.preventDefault();
    const out = {};
    for (const x of fields) {
      const el = $("#f_" + x.k);
      out[x.k] = x.type === "file" ? el.files[0] : el.value;
    }
    await onSave(out);
    $("#dlg").close();
  };
  $("#dlg").showModal();
}
const clamp = v => Math.min(5, Math.max(0, Math.round(+v) || 0));
const itemFields = (t, it = {title:"", sub:"", rating:3, status:t.statuses ? t.statuses[0] : ""}) => t.kind === "groups" ? [
  {k:"title", label:"Hobby", v:it.title},
  {k:"note", label:"Small note (optional)", v:it.note || "", hint:"For example: soon to be updated."},
  {k:"list", label:"Things under it (one per line)", type:"textarea", v:(it.sub || []).join("\n")}
] : [
  {k:"title", label:t.title, v:it.title},
  ...(t.categories ? [{k:"cat", label:"Type", type:"select", options:t.categories, v:it.cat || t.categories[0]}] : []),
  t.subOptions ? {k:"sub", label:t.sub, type:"select", options:t.subOptions, v:it.sub} : {k:"sub", label:t.sub, v:it.sub},
  t.kind === "rating"
    ? {k:"rating", label:"Rating (0 to 5 stars)", type:"number", v:it.rating, attrs:'min="0" max="5" step="1"'}
    : {k:"status", label:"Status", type:"select", options:t.statuses, v:it.status}
];
const toItem = (t, o) => t.kind === "groups"
  ? {title:o.title.trim(), note:o.note.trim(), sub:o.list.split("\n").map(x => x.trim()).filter(Boolean)}
  : {title:o.title.trim(), sub:o.sub.trim(), ...(t.categories ? {cat:o.cat} : {}), ...(t.kind === "rating" ? {rating:clamp(o.rating)} : {status:o.status})};
function resizePhoto(file){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 700 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = img.width * s; c.height = img.height * s;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", .85));
    };
    img.src = URL.createObjectURL(file);
  });
}
const split = s => s.split(",").map(x => x.trim()).filter(Boolean);

/* Events */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-tab],[data-act],[data-cat],[data-page]");
  if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; query = ""; cat = ""; page = 0; 
  $("#search").value = ""; renderTabs(); renderPanel(); return; }   
  if (b.dataset.cat !== undefined) { cat = b.dataset.cat; page = 0; renderPanel(); return; }   
  if (b.dataset.page !== undefined) { page = +b.dataset.page; renderPanel(); return; }
  const t = T[tab], list = S.items[tab], i = +b.dataset.i;
  const act = b.dataset.act;   
  if (act === "aedit") {
    const NL = String.fromCharCode(10);
    const c = CARDS[page], A = S.about, p = S.profile;
    const toLines = s => s.split(NL).map(x => x.trim()).filter(Boolean);
    const toPairs = s => toLines(s).map(x => { const n = x.indexOf(":"); return n < 0 ? {l:x, v:""} : {l:x.slice(0, n).trim(), v:x.slice(n + 1).trim()}; });
    if (c.type === "text") openForm(c.title, [{k:"v", label:"Write about yourself", type:"textarea", v:A.bio}], o => { A.bio = o.v.trim(); save(); renderPanel(); });
    else if (c.type === "pairs") openForm(c.title, [{k:"v", label:"One per line", type:"textarea", v:(A[c.k] || []).map(x => `${x.l}: ${x.v}`).join(NL), hint:"Write each one like  Height: 160 cm"}], o => { A[c.k] = toPairs(o.v); save(); renderPanel(); });
    else if (c.type === "lines") openForm(c.title, [{k:"v", label:"One per line", type:"textarea", v:(A[c.k] || []).join(NL)}], o => { A[c.k] = toLines(o.v); save(); renderPanel(); });
    else openForm(c.title, [{k:"likes", label:"Likes", v:p.likes.join(", "), hint:"Separate with commas."}, {k:"dislikes", label:"Dislikes", v:p.dislikes.join(", "), hint:"Separate with commas."}], o => { p.likes = split(o.likes); p.dislikes = split(o.dislikes); save(); renderPanel(); });
    return;
  }
  if (act === "add") openForm("Add " + t.title.toLowerCase(), itemFields(t), o => {
    list.unshift(toItem(t, o)); page = 0; save(); renderPanel(); });
  if (act === "edit") openForm("Edit " + t.title.toLowerCase(), itemFields(t, list[i]), o => {
    list[i] = toItem(t, o); save(); renderPanel(); });
  if (act === "up" && i > 0) { [list[i-1], list[i]] = [list[i], list[i-1]]; save(); renderPanel(); }   if (act === "down" && i < list.length - 1) { [list[i+1], list[i]] = [list[i], list[i+1]]; save(); renderPanel(); }   if (act === "del" && confirm("Remove “" + list[i].title + "”?")) { list.splice(i,1); save(); renderPanel(); }
  if (act === "current") {
    const c = S.current[tab] || {title:"", sub:""};
    openForm(t.now, [{k:"title", label:t.title, v:c.title}, {k:"sub", label:t.sub, v:c.sub}],
      o => { S.current[tab] = {title:o.title.trim(), sub:o.sub.trim()}; save(); renderPanel(); });
  }
});
$("#editToggle").onclick = () => {
  const on = document.body.classList.toggle("editing");
  $("#editToggle").textContent = on ? "Done editing" : "Edit page";
};
$("#editProfile").onclick = () => {
  const p = S.profile;
  openForm("Edit profile", [
    {k:"photo", label:"Photo", type:"file", hint:"Leave empty to keep your current photo."},
    {k:"name", label:"Name", v:p.name},
    {k:"tagline", label:"Short intro under your name", type:"textarea", v:p.tagline},
    {k:"socials", label:"Links", type:"textarea", v:(p.socials || []).map(x => `${x.l} | ${x.u}`).join("\n"), hint:"One per line, like  Instagram | https://instagram.com/yourname"}
  ], async o => {
    if (o.photo) p.photo = await resizePhoto(o.photo);
    p.name = o.name.trim() || "Your Name"; p.tagline = o.tagline.trim();
    p.socials = o.socials.split("\n").map(x => x.trim()).filter(Boolean).map(x => { const n = x.indexOf("|"); return n < 0 ? null : {l:x.slice(0, n).trim(), u:x.slice(n + 1).trim()}; }).filter(x => x && x.l && x.u);
    save(); renderProfile();
  });
};
$("#exp").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], {type:"application/json"}));
  a.download = "about-me-backup.json"; a.click();
};
$("#imp").onclick = () => $("#impFile").click();
$("#impFile").onchange = async e => {
  try {
    const d = JSON.parse(await e.target.files[0].text());
    if (!d.items || !d.profile || !d.current) throw 0;
    S = d; ensure(); if (!S.items.others) S.items.others = structuredClone(defaults.items.others); save(); renderAll();
  } catch (x) { alert("That file isn’t a valid backup."); }
};
$("#search").oninput = e => { query = e.target.value; page = 0; renderPanel(); }; 
  if (/[?&]edit\b/.test(location.search)) document.body.classList.add("can-edit");
renderAll();
</script>
